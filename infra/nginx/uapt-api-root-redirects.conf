# Include inside the eduaipolicy.org server. Exact matches prevent nginx's
# implicit slash redirect from cycling with Next.js's trailing-slash redirect.
# Keep the existing API rate limits, caches and handlers for every other path.
location = /api/public/v1 {
    return 308 https://eduaipolicy.org/api/public/v1/index.json$is_args$args;
}
location = /api/public/v1/ {
    return 308 https://eduaipolicy.org/api/public/v1/index.json$is_args$args;
}
