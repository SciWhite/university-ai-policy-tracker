# /etc/nginx/conf.d/uapt-html-cache.conf (http context). Installed once by hand
# with a receipt; the minimal routing's `location /` uses it (docs/program-release.md §6.1).
#
# Disk-backed cache of public HTML/RSC in front of the app. It survives app restarts
# and slot cutovers, unlike the app's in-memory ISR cache, so a restart no longer
# sends every visitor and crawler to cold 1-110 s renders.
proxy_cache_path /var/cache/nginx/uapt-html levels=1:2 keys_zone=uapt_html:64m max_size=3g inactive=7d use_temp_path=off;

# Never cached: private, API, MCP and search paths (they keep their own blocks or none).
map $uri $uapt_html_cache_skip {
    default 0;
    ~^/internal 1;
    ~^/api/ 1;
    ~^/mcp 1;
    ~^/(?:[a-zA-Z-]+/)?search 1;
}

# Purge = new epoch + reload (`uapt-program-release.py purge-html-cache`); old entries
# simply stop matching and age out (inactive/max_size). The epoch lives in its own file.
include /etc/nginx/conf.d/uapt-html-cache-epoch.inc;
