# /etc/nginx/conf.d/uapt-log-format.conf (http context), 2026-11-21.
# The combined format plus cache status and timings, appended at the end so tools that parse
# combined fields ($9 = status) keep working. Used by access_log in uapt-proxy-locations.conf.
log_format uapt_timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" uc=$upstream_cache_status '
                      'ut=$upstream_response_time rt=$request_time';
