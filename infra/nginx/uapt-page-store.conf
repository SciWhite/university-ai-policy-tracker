# /etc/nginx/conf.d/uapt-html-cache.conf (http context) for the render-once page store
# (docs/render-once.md; audit 2026-11-21 phase 2.2). Replaces infra/nginx/uapt-html-cache.conf
# when the generated routing uses `--page-store`. Installed by hand with a receipt.
#
# Pages are a pure function of (program build, content release, path). The page store keeps
# them on disk until a release replaces them:
#   * program release -> new $uapt_html_cache_epoch (uapt-program-release.py purge-html-cache,
#     done by `cutover`): everything is cold, the pre-rendered tree / warm-up refills it;
#   * content release -> new $uapt_html_content_generation (render-once.py generation): the
#     generic `location /` entries and every RSC variant go cold; school and changes documents
#     stay and only the changed URLs are refreshed (render-once.py refresh, X-UAPT-Refresh).
# min_free keeps the cache from filling the shared host's disk (nginx >= 1.19.1). keys_zone stays
# 64m (~500k keys): nginx refuses a reload that resizes an existing shared zone.
proxy_cache_path /var/cache/nginx/uapt-html levels=1:2 keys_zone=uapt_html:64m max_size=12g min_free=20g inactive=30d use_temp_path=off;

# Never cached: private, API, MCP and search paths (they keep their own blocks or none).
map $uri $uapt_html_cache_skip {
    default 0;
    ~^/internal 1;
    ~^/api/ 1;
    ~^/mcp 1;
    ~^/(?:[a-zA-Z-]+/)?search 1;
}

# Generic-page key path+query without `returnTo` (2026-11-21, kept from uapt-html-cache.conf). The
# page HTML does not depend on it: only client components read it from location.search, so every
# returnTo variant of a page is the same entry. Regex maps are tried in order; the first match wins.
map $request_uri $uapt_html_cache_uri {
    default $request_uri;
    "~^(?<uapt_p>[^?]*)\?returnTo=[^&]*$" $uapt_p;
    "~^(?<uapt_p>[^?]*)\?returnTo=[^&]*&(?<uapt_rest>.*)$" "$uapt_p?$uapt_rest";
    "~^(?<uapt_p>[^?]*\?.*?)&returnTo=[^&]*(?<uapt_rest>.*)$" "$uapt_p$uapt_rest";
}

# Program epoch (part of every key) and content generation (generic pages and RSC variants).
include /etc/nginx/conf.d/uapt-html-cache-epoch.inc;
include /etc/nginx/conf.d/uapt-html-content-generation.inc;

# Refresh = fetch from the app and overwrite the stored entry. Only from loopback (the TCP peer,
# not the real-IP address) and never with an edge header, so a request relayed by Cloudflare or a
# local tunnel cannot force it. The header value must be exactly 1.
map "$realip_remote_addr|$http_cf_connecting_ip|$http_cf_ray|$http_forwarded|$http_x_uapt_refresh" $uapt_page_store_refresh {
    default 0;
    "~^(?:127\.0\.0\.1|::1)\|\|\|\|1$" 1;
}

# School and changes documents ignore the query (the app never reads it there: force-static /
# readDevelopmentPreviewQuery), so `?returnTo=` and tracking parameters share one entry. RSC
# requests are keyed by everything the flight response can depend on, plus the content
# generation (they are not refreshed URL by URL).
map $http_rsc $uapt_page_store_variant {
    ""      "doc";
    default "rsc|$uapt_html_content_generation|$arg__rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree";
}

# One stored encoding per client class instead of Vary variants, so a refresh overwrites
# exactly the entries clients are served (render-once.py refresh fetches both).
map $http_accept_encoding $uapt_page_store_encoding {
    default  "identity";
    "~*gzip" "gzip";
}
map $uapt_page_store_encoding $uapt_page_store_upstream_encoding {
    gzip    "gzip";
    default "";
}

# Pre-rendered tree (render-once.py capture/activate): which file a request may be answered
# from. Only plain GET/HEAD documents and full (non-prefetch) RSC navigations; everything else,
# and every refresh, goes to the page store and the app.
map "$request_method|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$uapt_page_store_refresh" $uapt_page_tree_kind {
    default "none";
    "~^(?:GET|HEAD)\|\|\|\|0$"  "html";
    "~^(?:GET|HEAD)\|1\|\|\|0$" "rsc";
}
