# Include inside both existing UAPT server blocks, before generic /api locations.
location = /api/mcp {
    proxy_pass http://127.0.0.1:3110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 32k;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # No per-call access log, network identity or query retention for MCP.
    access_log off;
}
location = /api/plugin/status {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
location = /.well-known/openai-apps-challenge {
    default_type text/plain;
    alias /srv/uapt/openai-verification/openai-apps-challenge;
    add_header Cache-Control "no-store" always;
}
